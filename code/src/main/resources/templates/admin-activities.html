<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>活动管理 · 校园工作坊</title>
  <link rel="stylesheet" th:href="@{/css/site.css}">
  <link rel="stylesheet" th:href="@{/css/activity-management.css}">
</head>
<body>
  <div th:replace="~{fragments/header :: bar('manage')}"></div>
  <main class="sheet management">
    <div class="page-head"><h1>活动管理</h1><span class="free">全平台活动</span></div>
    <section class="management-card">
      <h2>全部活动 <small th:text="'共 ' + ${#lists.size(activities)} + ' 个'">共 0 个</small></h2>
      <p class="empty" th:if="${#lists.isEmpty(activities)}">暂无活动。</p>
      <div class="activity-row" th:each="item : ${activities}">
        <div>
          <a class="activity-title" th:href="@{/admin/activities/{id}(id=${item.id})}"
              th:text="${item.name}">活动名称</a>
          <p class="muted" th:text="${item.organizerName} + ' · ' + ${item.sessionCount} + ' 个场次'">组织者与场次</p>
        </div>
        <span class="status" th:classappend="${item.status.name()}"
            th:text="${item.status.label}">活动状态</span>
      </div>
    </section>
  </main>
</body>
</html>
