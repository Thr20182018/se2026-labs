<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 校园工作坊</title>
  <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body class="login-body">
  <header class="top">
    <a class="brand" href="/login">
      <img th:src="@{/images/mark.svg}" alt="">
      <span><strong>校园工作坊</strong><small>CAMPUS WORKSHOPS</small></span>
    </a>
    <span class="top-note">校园工作坊报名与候补管理系统</span>
  </header>
  <main class="login-grid">
    <section class="hero">
      <p class="eyebrow">CAMPUS WORKSHOPS</p>
      <h1>校园工作坊</h1>
      <p class="hero-foot">本校 · 免费 · 线下</p>
    </section>
    <section class="panel">
      <h2>登录</h2>
      <form th:action="@{/login}" method="post">
        <label>账号
          <input name="username" autocomplete="username" required>
        </label>
        <label>密码
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <p class="error" th:if="${param.error}">账号或密码错误，请重新输入</p>
        <p class="ok" th:if="${param.logout}">您已退出登录</p>
        <button type="submit">登录</button>
      </form>
    </section>
  </main>
</body>
</html>
