<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${activity.name} + ' · 活动管理'">活动管理</title>
  <link rel="stylesheet" th:href="@{/css/site.css}">
  <link rel="stylesheet" th:href="@{/css/activity-management.css}">
  <script defer th:src="@{/js/lifecycle.js}"></script>
</head>
<body>
  <div th:replace="~{fragments/header :: bar('manage')}"></div>
  <main class="sheet management">
    <a class="management-back" href="/admin/activities">← 活动管理</a>
    <div class="page-head">
      <h1 th:text="${activity.name}">活动名称</h1>
      <span class="status" th:classappend="${activity.status.name()}"
          th:text="${activity.status.label}">活动状态</span>
    </div>
    <p class="muted" th:text="'组织者：' + ${activity.organizerName}">组织者</p>
    <section class="management-card">
      <h2>活动信息</h2>
      <p class="activity-description" th:text="${activity.description}">活动简介</p>
    </section>
    <section class="management-card">
      <div class="page-head"><h2>活动场次</h2><span class="muted"
          th:text="'共 ' + ${#lists.size(activity.sessions)} + ' 个场次'">场次数量</span></div>
      <p class="empty" th:if="${#lists.isEmpty(activity.sessions)}">暂无场次。</p>
      <details class="session-editor" th:each="item : ${activity.sessions}"
          th:id="'session-' + ${item.id}">
        <summary>
          <span><span th:text="${#temporals.format(item.startTime, 'yyyy-MM-dd HH:mm')}">开始时间</span>
            <span th:text="' → ' + ${#temporals.format(item.endTime, 'yyyy-MM-dd HH:mm')}">结束时间</span>
            <span class="session-place" th:text="${item.location}">地点</span></span>
          <span class="status" th:classappend="${item.status.name()}"
              th:text="${item.status.label}">场次状态</span>
        </summary>
        <dl class="review-facts">
          <div><dt>报名截止</dt><dd th:text="${#temporals.format(item.deadline, 'yyyy-MM-dd HH:mm:ss')}">截止</dd></div>
          <div><dt>场次容量</dt><dd th:text="${item.capacity} + ' 人'">容量</dd></div>
        </dl>
        <form class="lifecycle-form session-operations"
            th:if="${activity.status.name() != 'CANCELLED' and item.status.name() != 'CANCELLED' and now.isBefore(item.endTime)}"
            th:action="@{/admin/activities/{id}/sessions/{sid}/cancel(id=${activity.id},sid=${item.id})}"
            method="post">
          <button class="danger-button" type="submit">取消此场次</button>
        </form>
      </details>
    </section>
    <section class="management-card" th:if="${activity.cancellable(now)}">
      <h2>取消活动</h2>
      <form class="lifecycle-form" th:action="@{/admin/activities/{id}/cancel(id=${activity.id})}"
          method="post">
        <button class="danger-button" type="submit">取消整个活动</button>
      </form>
    </section>
  </main>
</body>
</html>
