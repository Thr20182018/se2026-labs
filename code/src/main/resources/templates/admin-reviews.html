<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>审核管理 · 校园工作坊</title>
  <link rel="stylesheet" th:href="@{/css/site.css}">
  <link rel="stylesheet" th:href="@{/css/activity-management.css}">
</head>
<body>
  <div th:replace="~{fragments/header :: bar('review')}"></div>
  <main class="sheet management">
    <div class="page-head"><h1>审核管理</h1><span class="free"
        th:text="${#lists.size(requests)} + ' 个待审核申请'">待审核数量</span></div>
    <p class="error" role="alert" th:if="${message}" th:text="${message}"></p>
    <p class="ok" role="status" th:if="${notice}" th:text="${notice}"></p>
    <section class="management-card">
      <h2>待审核申请</h2>
      <p class="empty" th:if="${#lists.isEmpty(requests)}">当前没有待审核申请。</p>
      <div class="activity-row" th:each="item : ${requests}">
        <div>
          <a class="activity-title" th:href="@{${item.reviewUrl()}}"
              th:text="${item.name}">活动名称</a>
          <p class="muted" th:text="${item.organizerName}">组织者</p>
        </div>
        <span class="status PENDING" th:text="${item.kind.label}">审核类型</span>
      </div>
    </section>
  </main>
</body>
</html>
