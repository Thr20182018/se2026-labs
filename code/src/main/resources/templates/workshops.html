<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>发现工作坊 · 校园工作坊</title>
  <link rel="stylesheet" th:href="@{/css/site.css}">
  <link rel="stylesheet" th:href="@{/css/workshops.css}">
  <script defer th:src="@{/js/workshops.js}"></script>
</head>
<body class="workshops-page">
  <div th:replace="~{fragments/header :: bar('workshops')}"></div>
  <main class="sheet">
    <div class="page-head">
      <div>
        <h1>发现校园工作坊</h1>
        <p class="muted">从一场体验开始，让兴趣在校园里发生。</p>
      </div>
      <span class="free">免费线下活动</span>
    </div>
    <form class="filters" method="get" action="/workshops">
      <label>活动名称
        <input type="search" name="keyword" th:value="${keyword}" placeholder="输入活动名称关键词">
      </label>
      <label>场次举办日期
        <span class="dates">
          <input type="date" name="dateFrom" th:value="${dateFrom}">
          <span>至</span>
          <input type="date" name="dateTo" th:value="${dateTo}">
        </span>
      </label>
      <label>报名情况
        <select name="availability">
          <option value="" th:selected="${availability == ''}">全部状态</option>
          <option value="open" th:selected="${availability == 'open'}">可报名</option>
          <option value="waitlist" th:selected="${availability == 'waitlist'}">已满可候补</option>
          <option value="closed" th:selected="${availability == 'closed'}">已截止</option>
        </select>
      </label>
      <div class="filter-actions">
        <button type="submit">查询</button>
        <a href="/workshops">重置</a>
      </div>
    </form>
    <p class="error" th:if="${message}" th:text="${message}"></p>
    <section th:if="${result != null}">
      <div class="list-head">
        <h2>工作坊场次 <span th:text="'共 ' + ${result.total} + ' 个场次'">共 0 个场次</span></h2>
        <span class="muted">按开始时间从近到远</span>
      </div>
      <p class="empty" th:if="${result.total == 0}">暂无符合条件的场次</p>
      <div th:if="${result.total > 0}">
        <div class="session-columns" aria-hidden="true">
          <span>活动名称</span><span>场次时间</span><span>地点</span><span>报名情况</span>
        </div>
        <div class="sessions">
          <details class="session" th:each="row : ${result.rows}"
              th:id="'session-' + ${row.id}" th:open="${row.id == selectedId}">
            <summary class="session-summary" th:attr="aria-controls='session-content-' + ${row.id}">
              <strong class="session-title" th:text="${row.name}">活动名称</strong>
              <span class="session-time" th:text="${row.startDateLabel} + ' ' + ${row.clockRange}">时间</span>
              <span class="session-location" th:text="${row.location}">地点</span>
              <span class="status" th:classappend="${row.availability.name()}"
                  th:text="${row.availability.label}">可报名</span>
              <span class="session-chevron" aria-hidden="true"></span>
            </summary>
            <div class="session-content" th:id="'session-content-' + ${row.id}">
              <div class="session-detail-head">
                <h3 th:text="${row.name}">活动名称</h3>
                <button class="session-close" type="button">收起详情</button>
              </div>
              <div class="session-detail-body">
                <div class="session-about">
                  <h4>活动简介</h4>
                  <p th:text="${row.description}">简介</p>
                </div>
                <dl class="session-facts">
                  <div><dt>场次时间</dt><dd th:text="${row.detailTime}">时间</dd></div>
                  <div><dt>活动地点</dt><dd th:text="${row.location}">地点</dd></div>
                  <div><dt>报名截止</dt><dd th:text="${row.deadlineLabel}">截止</dd></div>
                  <div><dt>名额</dt>
                    <dd th:text="'共 ' + ${row.capacity} + ' 个，剩余 ' + ${row.remaining}">名额</dd>
                  </div>
                </dl>
              </div>
              <div class="session-detail-bottom">
                <span class="free">免费线下活动</span>
                <button class="session-action" type="button" disabled
                    th:text="${row.actionLabel}">报名此场次</button>
              </div>
            </div>
          </details>
        </div>
      </div>
      <nav class="pager" th:if="${result.pages > 1}">
        <a th:if="${result.page > 1}"
            th:href="@{/workshops(keyword=${keyword},dateFrom=${dateFrom},dateTo=${dateTo},availability=${availability},page=${result.page - 1})}">上一页</a>
        <span th:text="${result.page} + ' / ' + ${result.pages}">1 / 1</span>
        <a th:if="${result.page < result.pages}"
            th:href="@{/workshops(keyword=${keyword},dateFrom=${dateFrom},dateTo=${dateTo},availability=${availability},page=${result.page + 1})}">下一页</a>
      </nav>
    </section>
  </main>
</body>
</html>
