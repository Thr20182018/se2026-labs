<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>活动管理 · 校园工作坊</title>
  <link rel="stylesheet" th:href="@{/css/site.css}">
  <link rel="stylesheet" th:href="@{/css/activity-management.css}">
</head>
<body>
  <div th:replace="~{fragments/header :: bar('manage')}"></div>
  <main class="sheet management">
    <div class="page-head"><h1>活动管理</h1><span class="free">我的工作坊</span></div>
    <p class="error" role="alert" th:if="${message}" th:text="${message}"></p>
    <p class="ok" role="status" th:if="${notice}" th:text="${notice}"></p>
    <div class="management-grid">
      <section class="management-card">
        <h2>我的活动 <small th:text="'共 ' + ${#lists.size(activities)} + ' 个'">共 0 个</small></h2>
        <p class="empty" th:if="${#lists.isEmpty(activities)}">暂无活动。</p>
        <div class="activity-row" th:each="item : ${activities}">
          <div>
            <a class="activity-title" th:href="@{/organizer/activities/{id}(id=${item.id})}"
                th:text="${item.name}">活动名称</a>
            <p class="muted" th:text="${item.sessionCount} + ' 个场次'">场次数量</p>
            <div class="activity-review-statuses"
                th:if="${item.revisionStatus != null or item.hasNewSessionReviews()}">
              <div th:if="${item.revisionStatus != null}">
                <span class="status" th:classappend="${item.revisionStatus.name()}"
                    th:text="'内容修改：' + ${item.revisionStatus.label}">内容修改状态</span>
              </div>
              <div class="session-review-statuses" th:if="${item.hasNewSessionReviews()}">
                <span class="muted">新增场次：</span>
                <span class="status PENDING" th:if="${item.newSessionsPending > 0}"
                    th:text="'待审核 ' + ${item.newSessionsPending}">待审核数量</span>
                <span class="status REJECTED" th:if="${item.newSessionsRejected > 0}"
                    th:text="'已驳回 ' + ${item.newSessionsRejected}">已驳回数量</span>
                <span class="status PUBLISHED" th:if="${item.newSessionsPublished > 0}"
                    th:text="'已发布 ' + ${item.newSessionsPublished}">已发布数量</span>
              </div>
            </div>
          </div>
          <span class="status" th:classappend="${item.status.name()}"
              th:text="'活动：' + ${item.status.label}">活动状态</span>
        </div>
      </section>
      <section class="management-card">
        <h2>创建活动</h2>
        <form class="management-form" th:action="@{/organizer/activities}" method="post">
          <label>活动名称<input name="name" maxlength="200" required th:value="${draft.name}"></label>
          <label>活动简介<textarea name="description" rows="6" maxlength="10000" required
              th:text="${draft.description}"></textarea></label>
          <button type="submit">创建草稿</button>
        </form>
      </section>
    </div>
  </main>
</body>
</html>
