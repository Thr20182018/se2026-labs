<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的报名 · 校园工作坊</title>
  <link rel="stylesheet" th:href="@{/css/site.css}">
  <link rel="stylesheet" th:href="@{/css/registrations.css}">
  <script defer th:src="@{/js/lifecycle.js}"></script>
</head>
<body>
  <div th:replace="~{fragments/header :: bar('mine')}"></div>
  <main class="sheet registrations-page">
    <div class="page-head">
      <div>
        <h1>我的报名</h1>
      </div>
      <a class="discover-link" href="/workshops">发现工作坊</a>
    </div>
    <section class="registrations-empty" th:if="${#lists.isEmpty(registrations)}">
      <h2>还没有报名记录</h2>
      <a class="discover-link" href="/workshops">发现工作坊</a>
    </section>
    <section th:unless="${#lists.isEmpty(registrations)}" aria-label="报名记录">
      <div class="list-head">
        <h2>申请记录 <span th:text="'共 ' + ${#lists.size(registrations)} + ' 条'">共 0 条</span></h2>
      </div>
      <div class="registration-list">
        <article class="registration-row" th:each="item : ${registrations}">
          <div class="registration-head">
            <h3 th:text="${item.name}">活动名称</h3>
            <span class="status" th:classappend="${item.status.name()}"
                th:text="${item.status.label}">报名状态</span>
          </div>
          <dl class="registration-facts">
            <div><dt>场次时间</dt><dd th:text="${item.timeLabel()}">场次时间</dd></div>
            <div><dt>活动地点</dt><dd th:text="${item.location}">活动地点</dd></div>
            <div><dt>申请时间</dt>
              <dd th:text="${#temporals.format(item.registeredAt, 'yyyy-MM-dd HH:mm')}">申请时间</dd>
            </div>
          </dl>
          <div class="registration-actions">
            <form class="lifecycle-form" th:if="${item.cancellable(now)}"
                th:action="@{/me/sessions/{sid}/registrations/{rid}/cancel(sid=${item.sessionId},rid=${item.id})}"
                method="post">
              <button class="danger-button" type="submit"
                  th:text="${item.status.name() == 'WAITLIST'} ? '退出候补' : '取消报名'">取消报名</button>
            </form>
            <a class="discover-link" th:if="${item.status.name() == 'CANCELLED'}"
                th:href="@{/workshops(selected=${item.sessionId})}"
                th:text="${item.available and now.isBefore(item.deadline) and now.isBefore(item.end)} ? '重新申请' : '查看场次'">重新申请</a>
          </div>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
